[project]
name = "agent-contracts"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "jsonschema>=4.23.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/agent_contracts", "hatch_build.py", "pyproject.toml"]
