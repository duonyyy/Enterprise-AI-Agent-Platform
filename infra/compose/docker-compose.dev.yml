version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-postgres
    environment:
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: enterprise_agent_platform
      PLATFORM_APP_DB_PASSWORD: ${PLATFORM_APP_DB_PASSWORD:?PLATFORM_APP_DB_PASSWORD is required}
    ports: ["5432:5432"]
    volumes:
      - ../postgres/00-create-platform-app.sh:/docker-entrypoint-initdb.d/00-create-platform-app.sh:ro
      - ../../database/migrations/0001_baseline.sql:/docker-entrypoint-initdb.d/0001_baseline.sql:ro
      - ../../database/migrations/0002_fail_closed_rls.sql:/docker-entrypoint-initdb.d/0002_fail_closed_rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_owner -d enterprise_agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enterprise-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: enterprise-qdrant
    ports: ["6333:6333"]

  minio:
    # Development-only compose service. Pin this image before a production deployment.
    image: minio/minio:latest
    container_name: enterprise-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports: ["9000:9000", "9001:9001"]

  # Optional Enterprise Event Bus Profile (ADR-014)
  # Run with: docker compose --profile kafka up
  kafka:
    image: apache/kafka:3.7.0
    profiles: ["kafka"]
    container_name: enterprise-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6

  control-api:
    build:
      context: ../..
      dockerfile: apps/control-api/Dockerfile
    container_name: enterprise-control-api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://platform_app:${PLATFORM_APP_DB_PASSWORD:?PLATFORM_APP_DB_PASSWORD is required}@postgres:5432/enterprise_agent_platform
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ISSUER: http://localhost:8080/realms/enterprise
      JWT_AUDIENCE: enterprise-control-api
      RUNTIME_API_URL: http://agent-runtime:8001
    depends_on:
      postgres:
        condition: service_healthy

  agent-runtime:
    build:
      context: ../..
      dockerfile: apps/agent-runtime/Dockerfile
    container_name: enterprise-agent-runtime
    ports: ["8001:8001"]
    environment:
      DATABASE_URL: postgresql+psycopg://platform_app:${PLATFORM_APP_DB_PASSWORD:?PLATFORM_APP_DB_PASSWORD is required}@postgres:5432/enterprise_agent_platform
      REDIS_URL: redis://redis:6379/0
      RUNTIME_JWT_SECRET: ${RUNTIME_JWT_SECRET:?RUNTIME_JWT_SECRET is required}
      RUNTIME_JWT_ISSUER: http://localhost:8080/realms/enterprise
      RUNTIME_JWT_AUDIENCE: agent-runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  jobs-worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: apps/jobs-worker/Dockerfile
    container_name: enterprise-jobs-worker
    environment:
      DATABASE_URL: postgresql+psycopg://platform_app:${PLATFORM_APP_DB_PASSWORD:?PLATFORM_APP_DB_PASSWORD is required}@postgres:5432/enterprise_agent_platform
      REDIS_URL: redis://redis:6379/0
      WORKER_TENANT_ID: ${WORKER_TENANT_ID:-}
      WORKER_WORKSPACE_ID: ${WORKER_WORKSPACE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
