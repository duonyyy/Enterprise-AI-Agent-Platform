services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-postgres
    environment:
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: enterprise_agent_platform
      PLATFORM_APP_DB_PASSWORD: ${PLATFORM_APP_DB_PASSWORD:?PLATFORM_APP_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/00-create-platform-app.sh:/docker-entrypoint-initdb.d/00-create-platform-app.sh:ro
      # Generate from canonical migrations before first startup (see CONTRIBUTING).
      - ../../artifacts/evidence/local-bootstrap/01-migrations.sql:/docker-entrypoint-initdb.d/01-migrations.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_owner -d enterprise_agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: enterprise-redis
    # Durable AOF persistence for auth transaction and session revocation (DEC-AU-02)
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: enterprise-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    # Build from pinned official source; the old Docker Hub image cannot be pulled.
    image: enterprise-agent-platform-minio:2025-10-15
    build:
      context: ../minio
      dockerfile: Dockerfile
    container_name: enterprise-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: enterprise-agent-platform-minio:2025-10-15
    container_name: enterprise-minio-init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-agent-platform-docs}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ "$$S3_ACCESS_KEY" = "$$MINIO_ROOT_USER" ]; then
          echo "ERROR: S3_ACCESS_KEY must not equal MINIO_ROOT_USER" >&2
          exit 1
        fi
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET" >/dev/null
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null
        mc admin policy attach local readwrite --user "$$S3_ACCESS_KEY" >/dev/null 2>&1 || true
        echo "MinIO bucket and non-root application user provisioned."
    depends_on:
      minio:
        condition: service_healthy

  # Optional Enterprise Event Bus Profile (ADR-014; default is postgres_outbox)
  # Run with: docker compose --profile kafka up
  kafka:
    image: apache/kafka:3.7.0
    profiles: ["kafka"]
    container_name: enterprise-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6

  control-api:
    build:
      context: ../..
      dockerfile: apps/control-api/Dockerfile
    container_name: enterprise-control-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql+asyncpg://platform_app:${PLATFORM_APP_DB_PASSWORD:?PLATFORM_APP_DB_PASSWORD is required}@postgres:5432/enterprise_agent_platform
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8080/realms/enterprise}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-enterprise-control-api}
      RUNTIME_JWT_SECRET: ${RUNTIME_JWT_SECRET:?RUNTIME_JWT_SECRET is required}
      RUNTIME_JWT_ISSUER: ${RUNTIME_JWT_ISSUER:-http://localhost:8080/realms/enterprise}
      RUNTIME_JWT_AUDIENCE: ${RUNTIME_JWT_AUDIENCE:-agent-runtime}
      REDIS_URL: redis://redis:6379/0
      RUNTIME_API_URL: http://agent-runtime:8001
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-agent-platform-docs}
      AUTH_STORE_TYPE: ${AUTH_STORE_TYPE:-redis}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/enterprise}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-enterprise-studio}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-enterprise-studio-client-secret-dev-default-32ch}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/v1/auth/callback}
      OIDC_REDIRECT_ALLOWLIST: ${OIDC_REDIRECT_ALLOWLIST:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      INVITATIONS_ENABLED: ${INVITATIONS_ENABLED:-false}
      INVITATION_PUBLIC_APP_ORIGIN: ${INVITATION_PUBLIC_APP_ORIGIN:-http://localhost:3000}
      INVITATION_PROOF_ENCRYPTION_KEY: ${INVITATION_PROOF_ENCRYPTION_KEY:-}
      INVITATION_PROOF_KEY_ID: ${INVITATION_PROOF_KEY_ID:-v1}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  agent-runtime:
    build:
      context: ../..
      dockerfile: apps/agent-runtime/Dockerfile
      args:
        INSTALL_RETRIEVAL: "${AGENT_RUNTIME_INSTALL_RETRIEVAL:-1}"
    container_name: enterprise-agent-runtime
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql+psycopg://platform_app:${PLATFORM_APP_DB_PASSWORD:?PLATFORM_APP_DB_PASSWORD is required}@postgres:5432/enterprise_agent_platform
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_HEALTH_URL: http://qdrant:6333/healthz
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-agent-platform-docs}
      RUNTIME_JWT_SECRET: ${RUNTIME_JWT_SECRET:?RUNTIME_JWT_SECRET is required}
      RUNTIME_JWT_ISSUER: ${RUNTIME_JWT_ISSUER:-http://localhost:8080/realms/enterprise}
      RUNTIME_JWT_AUDIENCE: ${RUNTIME_JWT_AUDIENCE:-agent-runtime}
      E5_MODEL_SNAPSHOT: /opt/models/e5/614241f622f53c4eeff9890bdc4f31cfecc418b3
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ${E5_MODEL_SNAPSHOT:?E5_MODEL_SNAPSHOT is required}:/opt/models/e5/614241f622f53c4eeff9890bdc4f31cfecc418b3:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  studio-web:
    build:
      context: ../..
      dockerfile: apps/studio-web/Dockerfile
      args:
        NEXT_PUBLIC_CONTROL_API_URL: ${NEXT_PUBLIC_CONTROL_API_URL:-http://127.0.0.1:8000}
        NEXT_PUBLIC_RUNTIME_API_URL: ${NEXT_PUBLIC_RUNTIME_API_URL:-http://127.0.0.1:8001}
        CONTROL_API_INTERNAL_URL: http://control-api:8000
    container_name: enterprise-studio-web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_CONTROL_API_URL: ${NEXT_PUBLIC_CONTROL_API_URL:-http://127.0.0.1:8000}
      NEXT_PUBLIC_RUNTIME_API_URL: ${NEXT_PUBLIC_RUNTIME_API_URL:-http://127.0.0.1:8001}
      CONTROL_API_INTERNAL_URL: http://control-api:8000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      control-api:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy

  jobs-worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: apps/jobs-worker/Dockerfile
    container_name: enterprise-jobs-worker
    environment:
      DATABASE_URL: postgresql+psycopg://platform_app:${PLATFORM_APP_DB_PASSWORD:?PLATFORM_APP_DB_PASSWORD is required}@postgres:5432/enterprise_agent_platform
      REDIS_URL: redis://redis:6379/0
      WORKER_TENANT_ID: ${WORKER_TENANT_ID:-}
      WORKER_WORKSPACE_ID: ${WORKER_WORKSPACE_ID:-}
      WORKER_MODE: ${WORKER_MODE:-all}
      INVITATIONS_ENABLED: ${INVITATIONS_ENABLED:-false}
      INVITATION_PUBLIC_APP_ORIGIN: ${INVITATION_PUBLIC_APP_ORIGIN:-http://localhost:3000}
      INVITATION_PROOF_ENCRYPTION_KEY: ${INVITATION_PROOF_ENCRYPTION_KEY:-}
      INVITATION_PROOF_KEY_ID: ${INVITATION_PROOF_KEY_ID:-v1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10.0}
      ALLOW_PLAINTEXT_LOCAL_SMTP: ${ALLOW_PLAINTEXT_LOCAL_SMTP:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
