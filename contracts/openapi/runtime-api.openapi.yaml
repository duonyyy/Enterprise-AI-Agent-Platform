openapi: 3.1.0
info:
  title: Agent Runtime API v2.0
  version: 2.0.0
paths:
  /v1/runs:
    post:
      summary: Start run with pinned agent version
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '202': { description: Queued }
        '401': { description: Missing, invalid, expired, or revoked workspace bearer token }
        '403': { description: Workspace access denied, inactive membership/workspace/tenant, or insufficient scope }
        '503': { description: Authorization or session store temporarily unavailable }
  /v1/runs/{run_id}:
    get:
      summary: Get run status
      security:
        - BearerAuth: []
      parameters: [{ name: run_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Success }
        '401': { description: Missing, invalid, expired, or revoked workspace bearer token }
        '403': { description: Workspace access denied, inactive membership/workspace/tenant, or insufficient scope }
        '503': { description: Authorization or session store temporarily unavailable }
  /v1/runs/{run_id}/events:
    get:
      summary: Reconnectable SSE events stream
      description: >
        Requires live workspace membership, active tenant/workspace, and required runtime scope.
        Revalidates parent session and PostgreSQL authorization before each business event emission
        and on bounded intervals (<= 5s); emits an SSE error event and terminates on revocation
        or authorization backend timeout/unavailability.
      security:
        - BearerAuth: []
      parameters: [{ name: run_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Text/event-stream yielding run events and terminal error events on live revocation }
        '401': { description: Missing, invalid, expired, or revoked workspace bearer token }
        '403': { description: Workspace access denied, inactive membership/workspace/tenant, or insufficient scope }
        '503': { description: Authorization or session store temporarily unavailable }
  /internal/v1/runs/{run_id}/resume:
    post:
      summary: Private service resume with signed approval decision proof
      security:
        - BearerAuth: []
      parameters: [{ name: run_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Resumed }
        '401': { description: Missing, invalid, expired, or revoked workspace bearer token }
        '403': { description: Workspace access denied, inactive membership/workspace/tenant, or insufficient scope }
        '503': { description: Authorization or session store temporarily unavailable }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

