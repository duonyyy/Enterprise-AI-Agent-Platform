openapi: 3.1.0
info:
  title: Control Plane API v2.0
  version: 2.0.0
paths:
  /v1/auth/login:
    get:
      summary: Initiate OIDC Authorization Code Flow with PKCE S256
      parameters:
        - name: return_to
          in: query
          required: false
          schema: { type: string }
        - name: redirect
          in: query
          required: false
          schema: { type: boolean }
        - name: invitation_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: reauth
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Authorization transaction initiated
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, state]
                properties:
                  authorization_url: { type: string }
                  state: { type: string }
        '307':
          description: Temporary redirect to Identity Provider
  /v1/auth/callback:
    get:
      summary: Process OIDC Callback with Authorization Code and PKCE verification
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
        - name: error_description
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Authentication successful, session cookie set
          content:
            application/json:
              schema:
                type: object
                required: [user_id, issuer, subject]
                properties:
                  user_id: { type: string, format: uuid }
                  issuer: { type: string }
                  subject: { type: string }
                  display_name:
                    type: [string, "null"]
                  email_normalized:
                    type: [string, "null"]
                  redirect_url: { type: string }
        '302':
          description: Redirect to Studio with session cookie
        '400':
          description: Invalid authorization code, state, or PKCE verifier mismatch
        '401':
          description: OIDC token verification failed
        '503':
          description: Auth or session store unavailable
  /v1/auth/me:
    get:
      summary: Get current authenticated user profile and allowed workspaces
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile and memberships
          content:
            application/json:
              schema:
                type: object
                required: [user_id, issuer, subject, workspaces]
                properties:
                  user_id: { type: string, format: uuid }
                  issuer: { type: string }
                  subject: { type: string }
                  display_name:
                    type: [string, "null"]
                  email_normalized:
                    type: [string, "null"]
                  workspaces:
                    type: array
                    items:
                      type: object
                      required: [tenant_id, workspace_id, role]
                      properties:
                        tenant_id: { type: string, format: uuid }
                        tenant_slug: { type: string }
                        tenant_name: { type: string }
                        workspace_id: { type: string, format: uuid }
                        workspace_slug: { type: string }
                        workspace_name: { type: string }
                        role: { type: string }
        '401':
          description: Missing, expired, revoked, or superseded session
        '503':
          description: Session or identity store unavailable
  /v1/auth/refresh:
    post:
      summary: Atomically rotate active session within absolute lifetime
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Session rotated, new cookie set with bounded Max-Age
        '401':
          description: Session expired, revoked, superseded, or invalid
        '403':
          description: Cross-origin or cross-site request rejected
        '503':
          description: Session store unavailable
  /v1/auth/logout:
    post:
      summary: Revoke session and clear session cookie
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Session revoked successfully or local session cleared
        '403':
          description: Cross-origin or cross-site request rejected
        '503':
          description: Revocation store unavailable; local session cleared but server-side revocation could not be confirmed
  /v1/auth/token:
    post:
      summary: Exchange active session for short-lived workspace scoped API token
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id: { type: string, format: uuid }
      responses:
        '200':
          description: Scoped access token issued
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 900 }
        '401':
          description: Missing, expired, revoked, or superseded parent session
        '403':
          description: User lacks active membership in specified workspace or CSRF rejected
        '503':
          description: Session or identity store unavailable
  /v1/workspaces:
    get:
      summary: List active workspaces for the current authenticated user
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Active allowed workspaces
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - workspace_id
                        - tenant_id
                        - tenant_slug
                        - tenant_name
                        - workspace_slug
                        - workspace_name
                        - status
                        - role
                      properties:
                        workspace_id: { type: string, format: uuid }
                        tenant_id: { type: string, format: uuid }
                        tenant_slug: { type: string }
                        tenant_name: { type: string }
                        workspace_slug: { type: string }
                        workspace_name: { type: string }
                        status: { type: string, enum: [active, archived] }
                        role: { type: string, enum: [owner, admin, developer, operator, viewer] }
        '401':
          description: Missing, expired, revoked, or superseded session
        '403':
          description: Scoped workspace token cannot list global workspaces
        '503':
          description: Workspace or authorization store temporarily unavailable
    post:
      summary: Atomically provision a workspace and initial active Owner membership
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name]
              properties:
                slug:
                  type: string
                  minLength: 2
                  maxLength: 63
                  pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                tenant_id:
                  type: [string, "null"]
                  format: uuid
                tenant_slug:
                  type: [string, "null"]
                  minLength: 3
                  maxLength: 63
                  pattern: '^[a-z0-9][a-z0-9-]{2,62}$'
                tenant_name:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 255
                initial_owner_user_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        '201':
          description: Workspace and initial Owner membership created atomically
          content:
            application/json:
              schema:
                type: object
                required:
                  - workspace_id
                  - tenant_id
                  - tenant_slug
                  - tenant_name
                  - workspace_slug
                  - workspace_name
                  - status
                  - role
                  - created_at
                properties:
                  workspace_id: { type: string, format: uuid }
                  tenant_id: { type: string, format: uuid }
                  tenant_slug: { type: string }
                  tenant_name: { type: string }
                  workspace_slug: { type: string }
                  workspace_name: { type: string }
                  status: { type: string, enum: [active, archived] }
                  role: { type: string, enum: [owner, admin, developer, operator, viewer] }
                  initial_owner_user_id:
                    type: [string, "null"]
                    format: uuid
                  audit_event_id:
                    type: [string, "null"]
                    format: uuid
                  created_at: { type: string, format: date-time }
        '401':
          description: Missing, expired, revoked, or superseded session
        '403':
          description: Actor lacks tenant provisioning/owner authority, forged owner designation, or CSRF rejected
        '409':
          description: Workspace slug or tenant slug already exists
        '422':
          description: Invalid slug, name, UUID, or forbidden mass-assignment fields
        '503':
          description: Workspace persistence or authorization store temporarily unavailable
  /v1/workspaces/{workspace_id}:
    get:
      summary: Get active workspace details within authorized RLS scope
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                type: object
                required:
                  - workspace_id
                  - tenant_id
                  - tenant_slug
                  - tenant_name
                  - workspace_slug
                  - workspace_name
                  - status
                  - role
                  - created_at
                properties:
                  workspace_id: { type: string, format: uuid }
                  tenant_id: { type: string, format: uuid }
                  tenant_slug: { type: string }
                  tenant_name: { type: string }
                  workspace_slug: { type: string }
                  workspace_name: { type: string }
                  status: { type: string, enum: [active, archived] }
                  role: { type: string, enum: [owner, admin, developer, operator, viewer] }
                  initial_owner_user_id:
                    type: [string, "null"]
                    format: uuid
                  audit_event_id:
                    type: [string, "null"]
                    format: uuid
                  created_at: { type: string, format: date-time }
        '401':
          description: Missing, invalid, expired, or revoked credentials
        '403':
          description: Workspace access denied or active membership required
        '503':
          description: Authorization or workspace store temporarily unavailable
  /v1/workspaces/{workspace_id}/invitations:
    post:
      summary: Create a workspace invitation and enqueue delivery
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                  minLength: 3
                  maxLength: 254
                role:
                  type: string
                  enum: [admin, developer, operator, viewer]
      responses:
        '201':
          description: Invitation created and delivery queued
          content:
            application/json:
              schema: &workspace_invitation_dto
                type: object
                additionalProperties: false
                required:
                  - invitation_id
                  - tenant_id
                  - workspace_id
                  - recipient_email_normalized
                  - recipient_issuer
                  - role
                  - status
                  - generation
                  - delivery_state
                  - created_by_user_id
                  - delivery_requested_by_user_id
                  - expires_at
                  - created_at
                  - updated_at
                properties:
                  invitation_id: { type: string, format: uuid }
                  tenant_id: { type: string, format: uuid }
                  workspace_id: { type: string, format: uuid }
                  recipient_email_normalized: { type: string, minLength: 3, maxLength: 254 }
                  recipient_issuer: { type: string, minLength: 1 }
                  role: { type: string, enum: [admin, developer, operator, viewer] }
                  status: { type: string, enum: [pending, accepted, revoked, expired] }
                  generation: { type: integer, minimum: 1 }
                  delivery_state:
                    type: string
                    enum: [queued, sending, provider_accepted, failed, unknown, cancelled]
                  delivery_error_code: { type: [string, "null"] }
                  created_by_user_id: { type: string, format: uuid }
                  delivery_requested_by_user_id: { type: string, format: uuid }
                  revoked_by_user_id: { type: [string, "null"], format: uuid }
                  accepted_by_user_id: { type: [string, "null"], format: uuid }
                  expires_at: { type: string, format: date-time }
                  created_at: { type: string, format: date-time }
                  updated_at: { type: string, format: date-time }
                  provider_accepted_at: { type: [string, "null"], format: date-time }
                  revoked_at: { type: [string, "null"], format: date-time }
                  accepted_at: { type: [string, "null"], format: date-time }
                  audit_event_id: { type: [string, "null"], format: uuid }
                  outbox_event_id: { type: [string, "null"], format: uuid }
        '401':
          description: Missing, invalid, or expired application session
        '403':
          description: Active application session, CSRF/Origin check, or owner/admin role required
          content:
            application/json:
              schema: &invitation_error_response
                type: object
                additionalProperties: false
                required: [detail]
                properties:
                  detail:
                    type: object
                    additionalProperties: false
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
        '409':
          description: Membership or pending invitation conflict
          content:
            application/json:
              schema: *invitation_error_response
        '422':
          description: Invalid email, unsupported role, or malformed workspace_id
          content:
            application/json:
              schema: *invitation_error_response
        '429':
          description: Invitation rate limit exceeded
          content:
            application/json:
              schema: *invitation_error_response
        '503':
          description: Invitations disabled or misconfigured
          content:
            application/json:
              schema: *invitation_error_response
    get:
      summary: List workspace invitations with cursor pagination
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Workspace invitations page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: *workspace_invitation_dto
                  next_cursor: { type: [string, "null"] }
        '401':
          description: Missing, invalid, or expired application session
        '403':
          description: Active application session and owner/admin role required
          content:
            application/json:
              schema: *invitation_error_response
        '422':
          description: Invalid pagination cursor or parameters
          content:
            application/json:
              schema: *invitation_error_response
        '503':
          description: Invitation store temporarily unavailable
          content:
            application/json:
              schema: *invitation_error_response
  /v1/workspaces/{workspace_id}/invitations/{invitation_id}/resend:
    post:
      summary: Rotate invitation proof generation and queue redelivery
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: New invitation generation queued for delivery
          content:
            application/json:
              schema: *workspace_invitation_dto
        '401':
          description: Missing, invalid, or expired application session
        '403':
          description: Active application session, CSRF/Origin check, or owner/admin privilege required
          content:
            application/json:
              schema: *invitation_error_response
        '404':
          description: Invitation not found in workspace
          content:
            application/json:
              schema: *invitation_error_response
        '409':
          description: Invitation is not pending/unexpired or target user already holds membership record
          content:
            application/json:
              schema: *invitation_error_response
        '429':
          description: Resend cooldown or rate limit exceeded
          content:
            application/json:
              schema: *invitation_error_response
        '503':
          description: Invitations disabled or misconfigured
          content:
            application/json:
              schema: *invitation_error_response
  /v1/workspaces/{workspace_id}/invitations/{invitation_id}/revoke:
    post:
      summary: Revoke a pending workspace invitation
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Invitation revoked, already revoked, or expired
          content:
            application/json:
              schema: *workspace_invitation_dto
        '401':
          description: Missing, invalid, or expired application session
        '403':
          description: Active application session, CSRF/Origin check, or owner/admin privilege required
          content:
            application/json:
              schema: *invitation_error_response
        '404':
          description: Invitation not found in workspace
          content:
            application/json:
              schema: *invitation_error_response
        '409':
          description: Accepted invitation cannot be revoked
          content:
            application/json:
              schema: *invitation_error_response
        '503':
          description: Invitation store temporarily unavailable
          content:
            application/json:
              schema: *invitation_error_response
  /v1/invitations/{invitation_id}/handoff:
    post:
      summary: Store an encrypted browser-bound invitation proof handoff in Redis
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: &invitation_handoff_request
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 8
                  maxLength: 512
      responses:
        '201':
          description: Encrypted handoff persisted and HttpOnly browser-binding cookie issued
          content:
            application/json:
              schema: &invitation_handoff_response
                type: object
                additionalProperties: false
                required: [expires_at]
                properties:
                  expires_at: { type: string, format: date-time }
        '403':
          description: CSRF/Origin verification failed
          content:
            application/json:
              schema: *invitation_error_response
        '422':
          description: Malformed invitation ID or token payload (token input redacted)
        '429':
          description: Handoff rate limit exceeded
          content:
            application/json:
              schema: *invitation_error_response
        '503':
          description: Invitations disabled, misconfigured, or handoff store unavailable
          content:
            application/json:
              schema: *invitation_error_response
  /v1/invitations/{invitation_id}/preview:
    post:
      summary: Preview an invitation after verifying fresh identity and browser-bound handoff
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: Verified invitation preview metadata (non-consuming)
          content:
            application/json:
              schema: &invitation_preview_response
                type: object
                additionalProperties: false
                required:
                  - invitation_id
                  - tenant_id
                  - tenant_slug
                  - tenant_name
                  - workspace_id
                  - workspace_slug
                  - workspace_name
                  - role
                  - status
                  - expires_at
                  - can_accept
                  - acceptance_state
                properties:
                  invitation_id: { type: string, format: uuid }
                  tenant_id: { type: string, format: uuid }
                  tenant_slug: { type: string }
                  tenant_name: { type: string }
                  workspace_id: { type: string, format: uuid }
                  workspace_slug: { type: string }
                  workspace_name: { type: string }
                  role: { type: string, enum: [owner, admin, developer, operator, viewer] }
                  status: { type: string, enum: [pending, accepted] }
                  expires_at: { type: string, format: date-time }
                  can_accept: { type: boolean }
                  acceptance_state: { type: string, enum: [ready, already_accepted] }
                if:
                  properties:
                    role: { const: owner }
                  required: [role]
                then:
                  properties:
                    status: { const: accepted }
                    can_accept: { const: false }
                    acceptance_state: { const: already_accepted }
        '401':
          description: Missing, invalid, expired, or revoked application session
          content:
            application/json:
              schema: *invitation_error_response
        '403':
          description: Wrong credential type, stale/missing verified identity, CSRF failure, or recipient mismatch
          content:
            application/json:
              schema: *invitation_error_response
        '404':
          description: Invitation or handoff context not found, expired, or invalid
          content:
            application/json:
              schema: *invitation_error_response
        '409':
          description: Membership conflict, inviter authority lost, workspace inactive, or accepted by another user
          content:
            application/json:
              schema: *invitation_error_response
        '410':
          description: Invitation expired or revoked (returned only after verified recipient proof check)
          content:
            application/json:
              schema: *invitation_error_response
        '422':
          description: Invalid invitation ID or non-empty body
        '503':
          description: Authoritative session, handoff store, or database unavailable
          content:
            application/json:
              schema: *invitation_error_response
  /v1/invitations/{invitation_id}/accept:
    post:
      summary: Atomically accept a verified workspace invitation and activate membership
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: Membership activated or safely reconciled as already accepted
          content:
            application/json:
              schema: &invitation_accept_response
                type: object
                additionalProperties: false
                required:
                  - invitation_id
                  - tenant_id
                  - workspace_id
                  - workspace_slug
                  - workspace_name
                  - role
                  - acceptance_state
                  - redirect_url
                properties:
                  invitation_id: { type: string, format: uuid }
                  tenant_id: { type: string, format: uuid }
                  workspace_id: { type: string, format: uuid }
                  workspace_slug: { type: string }
                  workspace_name: { type: string }
                  role: { type: string, enum: [owner, admin, developer, operator, viewer] }
                  acceptance_state: { type: string, enum: [accepted, already_accepted] }
                  redirect_url: { type: string }
                if:
                  properties:
                    role: { const: owner }
                  required: [role]
                then:
                  properties:
                    acceptance_state: { const: already_accepted }
        '401':
          description: Missing, invalid, expired, or revoked application session
          content:
            application/json:
              schema: *invitation_error_response
        '403':
          description: Wrong credential type, stale/missing verified identity, CSRF failure, or recipient mismatch
          content:
            application/json:
              schema: *invitation_error_response
        '404':
          description: Invitation or handoff context not found, expired, or invalid
          content:
            application/json:
              schema: *invitation_error_response
        '409':
          description: Membership conflict, inviter authority lost, workspace inactive, or accepted by another user
          content:
            application/json:
              schema: *invitation_error_response
        '410':
          description: Invitation expired or revoked (returned only after verified recipient proof check)
          content:
            application/json:
              schema: *invitation_error_response
        '422':
          description: Invalid invitation ID or unexpected request body
        '503':
          description: Authoritative session, handoff store, or database unavailable
          content:
            application/json:
              schema: *invitation_error_response
  /v1/workspaces/{workspace_id}/memberships:
    get:
      summary: List workspace memberships with cursor pagination
      description: Requires an active application session and live active Owner or Admin role.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, invited, revoked] }
      responses:
        '200':
          description: Workspace memberships page
          content:
            application/json:
              schema: &workspace_membership_list_response
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: &workspace_membership_dto
                      type: object
                      additionalProperties: false
                      required:
                        - membership_id
                        - user_id
