openapi: 3.1.0
info:
  title: Control Plane API v2.0
  version: 2.0.0
paths:
  /v1/auth/login:
    get:
      summary: Initiate OIDC Authorization Code Flow with PKCE S256
      parameters:
        - name: return_to
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Authorization transaction initiated
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, state]
                properties:
                  authorization_url: { type: string }
                  state: { type: string }
        '307':
          description: Temporary redirect to Identity Provider
  /v1/auth/callback:
    get:
      summary: Process OIDC Callback with Authorization Code and PKCE verification
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
        - name: error_description
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Authentication successful, session cookie set
          content:
            application/json:
              schema:
                type: object
                required: [user_id, issuer, subject]
                properties:
                  user_id: { type: string, format: uuid }
                  issuer: { type: string }
                  subject: { type: string }
                  display_name:
                    type: [string, "null"]
                  email_normalized:
                    type: [string, "null"]
                  redirect_url: { type: string }
        '302':
          description: Redirect to Studio with session cookie
        '400':
          description: Invalid authorization code, state, or PKCE verifier mismatch
        '401':
          description: OIDC token verification failed
  /v1/auth/me:
    get:
      summary: Get current authenticated user profile and allowed workspaces
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile and memberships
          content:
            application/json:
              schema:
                type: object
                required: [user_id, issuer, subject, workspaces]
                properties:
                  user_id: { type: string, format: uuid }
                  issuer: { type: string }
                  subject: { type: string }
                  display_name:
                    type: [string, "null"]
                  email_normalized:
                    type: [string, "null"]
                  workspaces:
                    type: array
                    items:
                      type: object
                      required: [tenant_id, workspace_id, role]
                      properties:
                        tenant_id: { type: string, format: uuid }
                        tenant_slug: { type: string }
                        tenant_name: { type: string }
                        workspace_id: { type: string, format: uuid }
                        workspace_slug: { type: string }
                        workspace_name: { type: string }
                        role: { type: string }
        '401':
          description: Missing or expired session
  /v1/auth/refresh:
    post:
      summary: Refresh active session within absolute lifetime
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Session refreshed, new cookie set
        '401':
          description: Session expired, revoked, or invalid
  /v1/auth/logout:
    post:
      summary: Revoke session and clear session cookie
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Session revoked successfully
  /v1/auth/token:
    post:
      summary: Exchange active session for short-lived workspace scoped API token
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id: { type: string, format: uuid }
      responses:
        '200':
          description: Scoped access token issued
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 900 }
        '403':
          description: User lacks active membership in specified workspace
  /v1/workspaces:
    post:
      summary: Create workspace
      responses:
        '201': { description: Created }
  /v1/workspaces/{workspace_id}/agents:
    get:
      summary: List agents
      parameters: [{ name: workspace_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Success }
    post:
      summary: Create agent draft
      parameters: [{ name: workspace_id, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: Created }
  /v1/workspaces/{workspace_id}/agents/{agent_id}/publish:
    post:
      summary: Atomically publish immutable agent version
      parameters:
        - { name: workspace_id, in: path, required: true, schema: { type: string } }
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Published }
  /v1/workspaces/{workspace_id}/approvals:
    get:
      summary: List pending approval requests
      parameters: [{ name: workspace_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Success }
  /v1/workspaces/{workspace_id}/approvals/{approval_id}/decision:
    post:
      summary: Submit CAS approval decision
      parameters:
        - { name: workspace_id, in: path, required: true, schema: { type: string } }
        - { name: approval_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Decision committed }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: agent_session
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
