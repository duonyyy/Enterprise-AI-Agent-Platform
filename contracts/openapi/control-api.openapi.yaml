components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: agent_session
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    HandoffCookie:
      type: apiKey
      in: cookie
      name: agent_invite_handoff
  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ModelId:
      name: model_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  headers:
    DraftETag:
      description: Strong ETag of draft revision; not published version
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  schemas:
    ModelConfig:
      type: object
      additionalProperties: false
      required: [id, tenantId, workspaceId, name, provider, providerModelId, status, settings, createdAt]
      properties:
        id: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        provider: {type: string, minLength: 1, maxLength: 64}
        providerModelId: {type: string, minLength: 1, maxLength: 128}
        status: {type: string, enum: [active, disabled]}
        settings: {type: object}
        secretRef: {type: [string, "null"], maxLength: 128}
        createdAt: {type: string, format: date-time}
    CreateModelConfig:
      type: object
      additionalProperties: false
      required: [name, provider, providerModelId]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        provider: {type: string, minLength: 1, maxLength: 64}
        providerModelId: {type: string, minLength: 1, maxLength: 128}
        secretRef: {type: [string, "null"], maxLength: 128}
        settings: {type: object}
    UpdateModelConfig:
      type: object
      additionalProperties: false
      properties:
        name: {type: [string, "null"], minLength: 1, maxLength: 128}
        settings: {type: [object, "null"]}
        secretRef: {type: [string, "null"], maxLength: 128}
    ModelConfigPage:
      type: object
      additionalProperties: false
      required: [items, totalCount]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ModelConfig'}
        nextCursor: {type: [string, "null"]}
        totalCount: {type: integer, minimum: 0}
    AgentSpec:
      $ref: ../jsonschema/agent-spec.v1.schema.json
    CreateAgentDraft:
      type: object
      additionalProperties: false
      required: [slug, display_name, spec]
      properties:
        slug: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-z0-9_-]+$'}
        display_name: {type: string, minLength: 1, maxLength: 256}
        spec: {$ref: '#/components/schemas/AgentSpec'}
    ReplaceAgentDraftSpec:
      type: object
      additionalProperties: false
      required: [spec]
      properties:
        spec: {$ref: '#/components/schemas/AgentSpec'}
    AgentDraftMetadata:
      type: object
      additionalProperties: false
      required: [agent_id, slug, display_name, revision, archived_at, created_at]
      properties:
        agent_id: {type: string, format: uuid}
        slug: {type: string}
        display_name: {type: string}
        revision: {type: integer, minimum: 1}
        archived_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    AgentDraft:
      type: object
      additionalProperties: false
      required: [agent_id, slug, display_name, revision, archived_at, created_at, spec]
      properties:
        agent_id: {type: string, format: uuid}
        slug: {type: string}
        display_name: {type: string}
        revision: {type: integer, minimum: 1}
        archived_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        spec: {$ref: '#/components/schemas/AgentSpec'}
    AgentDraftPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AgentDraftMetadata'}
        next_cursor: {type: [string, 'null']}
    ValidateAgentDraftRequest:
      type: object
      additionalProperties: false
      properties:
        spec:
          type: object
          description: Raw AgentSpec object to diagnose. Structural errors return 200 with invalid_spec diagnostics; explicit null and non-object values return 422. Omit to validate the persisted draft.
    AgentDiagnostic:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: {type: string}
        code:
          type: string
          enum: [invalid_spec, dependency_unavailable, dependency_not_permitted, unsupported_capability]
        message: {type: string}
    AgentValidationResult:
      type: object
      additionalProperties: false
      required: [agent_id, revision, ready, diagnostics]
      properties:
        agent_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        ready: {type: boolean}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/AgentDiagnostic'}
    PublishAgentRequest:
      type: object
      required:
        - expected_revision
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Committed integer draft revision expected at publication
    PublishAgentResponse:
      type: object
      required:
        - agent_id
        - agent_version_id
        - version
        - bundle_sha256
        - is_immutable
        - created_at
      additionalProperties: false
      properties:
        agent_id:
          type: string
          format: uuid
        agent_version_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        bundle_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        is_immutable:
          type: boolean
        created_at:
          type: string
          format: date-time
        spec_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
    AgentVersionMetadata:
      type: object
      required:
        - agent_id
        - agent_version_id
        - version
        - bundle_sha256
        - is_immutable
        - created_at
      additionalProperties: false
      properties:
        agent_id:
          type: string
          format: uuid
        agent_version_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        bundle_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        is_immutable:
          type: boolean
        created_at:
          type: string
          format: date-time
        published_by:
          type: string
          format: uuid
          nullable: true
        model_name:
          type: string
          nullable: true
    AgentVersionPage:
      type: object
      required:
        - items
        - next_cursor
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentVersionMetadata'
        next_cursor:
          type: string
          nullable: true
    AgentPublication:
      type: object
      required:
        - publication_id
        - agent_id
        - agent_version_id
        - version
        - environment
        - revision
        - bundle_sha256
        - published_at
      additionalProperties: false
      properties:
        publication_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        agent_version_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        environment:
          type: string
          enum: [development, staging, production]
        revision:
          type: integer
          minimum: 1
        bundle_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        published_at:
          type: string
          format: date-time
    AgentPublicationList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentPublication'
    PromoteAgentVersionRequest:
      type: object
      required:
        - agent_version_id
        - environment
        - expected_publication_revision
      additionalProperties: false
      properties:
        agent_version_id:
          type: string
          format: uuid
        environment:
          type: string
          enum: [development, staging, production]
        expected_publication_revision:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Expected publication pointer revision (0 for initial publication to an environment)
    PromoteAgentVersionResponse:
      type: object
      required:
        - publication_id
        - agent_id
        - agent_version_id
        - version
        - environment
        - revision
        - bundle_sha256
        - published_at
        - is_noop
      additionalProperties: false
      properties:
        publication_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        agent_version_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        environment:
          type: string
          enum: [development, staging, production]
        revision:
          type: integer
          minimum: 1
        bundle_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        published_at:
          type: string
          format: date-time
        is_noop:
          type: boolean
    AgentError:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
  responses:
    AgentInvalidRequest:
      description: Invalid input, schema, cursor or If-Match syntax. Missing If-Match must use 428, not generic 422.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AgentError'}
    AgentNotFound:
      description: Agent not found in the authorized workspace.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AgentError'}
    AgentConflict:
      description: Slug conflict or archived Agent cannot be modified.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AgentError'}
    AgentStaleRevision:
      description: detail.code stale_revision. Refetch before explicit retry.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AgentError'}
    AgentPreconditionRequired:
      description: detail.code revision_required or precondition_required. If-Match is missing.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AgentError'}
    AgentUnavailable:
      description: Database or session store unavailable. Never return seed or in-memory success.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AgentError'}
