name: Enterprise CI Pipeline

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Conventional Commit Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked commitlint dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate commits in this pull request
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  changes:
    name: Detect Changed Project Areas
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'apps/control-api/**'
              - 'apps/agent-runtime/**'
              - 'apps/jobs-worker/**'
              - 'libs/python/**'
              - 'contracts/**'
              - 'database/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci-python.yml'
            web:
              - 'apps/studio-web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'contracts/**'
              - '.github/workflows/ci-python.yml'
            docker:
              - 'apps/**/Dockerfile'
              - 'infra/**'
              - 'database/migrations/**'
              - 'scripts/run_migrations.py'
              - 'scripts/validate_database_schema.py'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci-python.yml'

  static-analysis:
    name: Python Compilation & Database Schema Validation
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --all-packages --locked --group dev

      # The repository has a pre-existing Ruff backlog.  Keep CI actionable
      # while that baseline is paid down in a dedicated cleanup change.
      - name: Compile Python sources
        run: |
          uv run python -B -m compileall -q apps libs tests

      - name: Validate static database definitions (not live RLS proof)
        run: |
          uv run python -B scripts/validate_database_schema.py

  contract-and-unit-tests:
    name: Contract & Unit Test Suite
    runs-on: ubuntu-latest
    needs: [changes, static-analysis]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --all-packages --locked --group dev

      - name: Prepare isolated storage test images
        run: |
          docker pull postgres:16-alpine
          docker pull qdrant/qdrant:v1.9.0
          docker build -t enterprise-agent-platform-minio:2025-10-15 infra/minio

      - name: Run Contract & Core Tests
        env:
          # Core unit imports require settings; live SQL uses the owned Docker fixture.
          DATABASE_URL: postgresql+psycopg://platform_app:ci-fixture-only@127.0.0.1:1/unit_imports_only
          JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-characters-long
          JWT_ISSUER: http://localhost:8080/realms/enterprise
          JWT_AUDIENCE: enterprise-control-api
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest tests/contract/ tests/integration/ apps/control-api/tests apps/jobs-worker/tests -v

      - name: Retain sanitized database test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step01-postgres-evidence
          path: artifacts/evidence/step01-fixtures/
          if-no-files-found: warn
          retention-days: 7

  web-build:
    name: Studio Web Build
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Studio Web
        run: pnpm --filter studio-web build

  docker-compose-gate:
    name: Docker Deployment Spec Gate
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Generate transactional PostgreSQL bootstrap
        run: |
          uv sync --all-packages --locked --group dev
          uv run python -B scripts/run_migrations.py --write-bootstrap artifacts/evidence/local-bootstrap/01-migrations.sql

      - name: Validate Docker Compose Configuration
        env:
          POSTGRES_PASSWORD: ci-owner-password
          PLATFORM_APP_DB_PASSWORD: ci-app-password
          JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-characters-long
          RUNTIME_JWT_SECRET: ci-runtime-jwt-secret-at-least-32-characters
          MINIO_ROOT_USER: ci-minio-root-user
          MINIO_ROOT_PASSWORD: ci-minio-root-password
          S3_ACCESS_KEY: ci-app-s3-access-key
          S3_SECRET_KEY: ci-app-s3-secret-key-at-least-16-chars
          E5_MODEL_SNAPSHOT: ./models
        run: |
          mkdir -p models
          docker compose -f infra/compose/docker-compose.dev.yml config --quiet
          docker compose -f infra/compose/docker-compose.dev.yml build minio control-api agent-runtime jobs-worker
