[mypy]
strict = True
follow_imports = skip
mypy_path = apps/agent-runtime/typings

# Resolve the typed boundary libraries without traversing the Torch dependency graph.
# The four retrieval modules are passed explicitly as check targets.
[mypy-pydantic,pydantic.*,httpx,httpx.*,pydantic_core,pydantic_core.*,typing_extensions,rank_bm25]
follow_imports = silent
