[project]
name = "agent-runtime"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "langgraph>=0.0.30",
    "redis>=5.0.0",
    "platform-common",
    "agent-contracts"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
bm25 = [
    "rank-bm25==0.2.2",
]
retrieval = [
    "sentence-transformers==6.2.0",
    "transformers==5.10.2",
    "torch==2.12.0",
    "rank-bm25==0.2.2",
]
